name: TypeScript package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: src/typescript/package-lock.json
      - name: Install
        working-directory: src/typescript
        run: npm ci
      - name: Build
        working-directory: src/typescript
        run: npm run build
      - name: Test
        working-directory: src/typescript
        run: npm test

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/typescript/package-lock.json
      - name: Install
        working-directory: src/typescript
        run: npm ci
      - name: Construct npm package
        working-directory: src/typescript
        run: npm run package
      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: directory-index-to-html-npm-package
          path: src/typescript/*.tgz
